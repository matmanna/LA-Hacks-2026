[project]
name = "betterbill-voice"
version = "0.1.0"
description = "LiveKit audio controller for the hosted BetterBills agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents>=1.8.8,<2",
  "aiohttp>=3.10,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
betterbill-voice = "betterbill_voice.worker:main"

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
