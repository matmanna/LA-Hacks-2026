name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  NODE_ENV: test
  DATABASE_URL: postgres://bb:bb@localhost:5432/betterbill_test
  BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
  BETTER_AUTH_URL: http://localhost:3001
  BB_READER_MODE: cache_only
jobs:
  voice-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/voice-controller
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          working-directory: agents/voice-controller
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync ruff check .
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: bb
          POSTGRES_PASSWORD: bb
          POSTGRES_DB: betterbill_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bb -d betterbill_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
      - run: bun x biome ci .
      - run: bun run data:check # bundled data matches data/
      - run: bun run check-types
      - run: bun run test # Vitest unit (packages/core with coverage thresholds)
      - run: bun run db:migrate # against the service container only
      - run: bun run db:seed
      - name: Prepare isolated voice test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE betterbill_voice_test;'
          DATABASE_URL=postgres://bb:bb@localhost:5432/betterbill_voice_test bun run db:migrate
      - run: bun run test:integration
        env:
          VOICE_TEST_DATABASE_URL: postgres://bb:bb@localhost:5432/betterbill_voice_test
      - run: bun run build
  migrate-shared:
    # Runs on main only. Skips until DATABASE_URL_SHARED is set (B-04, B-16).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: shared-db
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_SHARED }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - run: bun install --frozen-lockfile
        if: env.DATABASE_URL != ''
      - run: bun run db:migrate
        if: env.DATABASE_URL != ''
