name: android-apk
# Builds a release APK for every push to main and publishes it as a GitHub
# release. The app talks to the server named by the repository variable
# EXPO_PUBLIC_SERVER_URL (Settings > Secrets and variables > Actions >
# Variables). Use an https URL: Android blocks plain http in release builds.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-apk
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SERVER_URL: ${{ vars.EXPO_PUBLIC_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the server URL
        run: |
          if [ -z "$EXPO_PUBLIC_SERVER_URL" ]; then
            echo "::error::Set the repository variable EXPO_PUBLIC_SERVER_URL"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.12 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - name: Generate the Android project
        working-directory: apps/native
        run: bunx expo prebuild --platform android --no-install
      - name: Number the build
        working-directory: apps/native/android/app
        run: sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
      - name: Build the release APK
        working-directory: apps/native/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          tag="apk-${{ github.run_number }}"
          apk="betterbill-${short}.apk"
          cp apps/native/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Android build ${{ github.run_number }} (${short})" \
            --notes "Android APK built from main at ${GITHUB_SHA}. Release builds use a debug signing key, so install by sideloading." \
            --latest
